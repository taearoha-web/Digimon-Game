name: Validate Toon Tale
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      XDG_DATA_HOME: /tmp/toon-ci-data
      XDG_CONFIG_HOME: /tmp/toon-ci-config
      XDG_CACHE_HOME: /tmp/toon-ci-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Godot 4.3
        run: |
          curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import assets
        run: Godot_v4.3-stable_linux.x86_64 --headless --editor --import --path .
      - name: Validate scripts
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . -s res://tools/check_scripts.gd
      - name: Validate character assembly and material reuse
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . -s res://tests/integration/character_finish_test.gd
      - name: Validate save recovery and progression
        env:
          XDG_DATA_HOME: /tmp/toon-ci-save
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/save_progression_test.tscn
      - name: Validate daily save backups and restore
        env:
          XDG_DATA_HOME: /tmp/toon-ci-backup
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/save_backup_test.tscn
      - name: Shared storage (every character sees it, other-class gear stays greyed, old storages move in once with nothing lost or doubled, cloud bundle, backups, deleting a character keeps it)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-shared-storage
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/shared_storage_test.tscn
      - name: Audit every skill and graphics quality
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/skill_presentation_test.tscn
      - name: Validate Armageddon hits, resource use, pause and scene cleanup
        env:
          XDG_DATA_HOME: /tmp/toon-ci-armageddon
        run: Godot_v4.3-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/integration/armageddon_test.tscn
      - name: skill_feel_test (skill weight for every class, ultimate cut-in and slow motion for the hero only, capped hit-stop and camera shake, throws resisted by bosses, element flashes, ground marks dropped under memory pressure)
        timeout-minutes: 10
        env:
          XDG_DATA_HOME: /tmp/toon-ci-skill_feel_test
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/skill_feel_test.tscn
      - name: melee_art_test (Warrior / Lancer / Defender class layers for every skill and star skill, trimmed under memory pressure and low quality, pooled with no node growth, budget released)
        timeout-minutes: 10
        env:
          XDG_DATA_HOME: /tmp/toon-ci-melee_art_test
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/melee_art_test.tscn
      - name: Validate every authored skill recipe
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/art_direction_test.tscn -- skills
      - name: Validate elemental geometry budgets and cleanup
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/element_fx_budget_test.tscn
      - name: Validate mobile control layout and populated HUD
        env:
          XDG_DATA_HOME: /tmp/toon-ci-ui
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/tools/ui_polish_review.tscn
      - name: Check a list rebuilt by its own button keeps the tapped button in the tree
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/ui_rebuild_tap_test.tscn
      - name: Check effect materials keep their shaders compiled
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/material_keeper_test.tscn
      - name: Check guild-war rosters (5v5, Lv.100 / 200 stars, gear grades, balanced guilds)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-gw-data
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/guild_war_data_test.tscn
      - name: Play a guild war (teams, damage rules, falls and respawn, orb, sudden death, result) and check the arena opponents
        env:
          XDG_DATA_HOME: /tmp/toon-ci-gw-match
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/guild_war_match_test.tscn
      - name: Guild-war parties (five a party, the player's picks and สุ่มให้, random even parties on both sides, buffs only inside the caster's party, heals unchanged, the allied Bard's song, resume)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-gw-party
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/guild_war_party_test.tscn
      - name: Guild leaders (the player picks who leads each guild - the hero, a member or another of the player's characters; the picker; the save; fallbacks; in the war a picked ally leads, is crowned, tank-built, escorted and takes the altar while the hero cannot; a picked rival leads them; another character never fights and the default stands in)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-gw-leaders
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/guild_leader_choice_test.tscn
      - name: Guild-war tactics (one commander brain per guild - gather at a rally point and push together, fall back from a lost fight and come again, defend the altar, guard and escort the leader, the members in first and the leader behind, focus healers and exposed leaders, tanks in front of healers, staggered stuns, rate-limited callouts - and the tough leaders' HP / DEF, stun resistance and last-stand shield, deterministic with a seed)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-gw-tactics
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/guild_war_tactics_test.tscn
      - name: Castle switches and the altar's barrier (two switches in the throne room's corners held by standing in the circle, contested by one enemy inside; the barrier blocks the leader until both are held, freezes the count when one is lost and lets it go on from the same second when retaken; leaving the room or falling counts nothing; HUD chips and warning; the party sent to a switch; the online status; the AI posts holders, secures both, captures on its own and contests the switches while holding the castle)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-gw-switch
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/castle_switch_test.tscn
      - name: Guild leaders go in last (the members push in first, take the switches and clear the altar while the AI leader waits behind them with its healers; it goes up only with the barrier open and the way clear, falls back behind its own when attacked, and the castle's holder keeps its leader behind the altar - both guilds AI-led in a seeded throne-room fight, the leader behind most of its guild and falling far less than its members)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-gw-leader-rear
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/guild_leader_rear_test.tscn
      - name: World players (the scheduled players of Alpha, Neverdie and no guild, hunting in the fields, kill credit), the party, the game registry and the guild registrar
        env:
          XDG_DATA_HOME: /tmp/toon-ci-world-players
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/world_players_test.tscn
      - name: World players forge their own gear (the same on every device, the hero's drop rates and forge odds, a + only through recorded events, the 250★ set from ★250 in order by its recipe, both endgame maps, fighters / card / stall wear the same, bench)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-world-gear
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/world_gear_test.tscn
      - name: Guild daily quests and the guild points shop (only in a guild, three quests a Thai day drawn from the guild and the day, the hero's kills / field bosses / forge successes / war wins / jewel pickups count plus the online guild mates' capped share, claimed once for guild points and gold, the shop gives chaos jewels / feathers / drills / pink jewels / god HP potions, a new day starts over, saves stay valid)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-guild-quest
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/guild_quest_test.tscn
      - name: Weekly guild league (Monday-Sunday Thai seasons, the wars the hero does not fight seeded from real power, the hero's real war takes its round's place, the castle holder at the season's end is champion with a crown plate / EXP +10% / the secret shop for its members only, top three claim once, saves stay valid through JSON and disk)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-guild-league
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/guild_league_test.tscn
      - name: Four-guild league (Alpha / Neverdie / Titan / 3DLnw picked by everyone, twenty or more at Lv.100 in each, three rounds a day at 12:00 / 18:00 / 21:30 Thai covering all six pairs, registration closes five minutes before, the hero fights only in its guild's top twenty, seeded results without the hero, live results counted, old saves re-pick their guild once, the desk's schedule / watch buttons)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-guild-league4
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/guild_league4_test.tscn
      - name: League rounds are frozen once over (a seeded round is never worked out again even when the seeding changes, the device's record survives a restart offline, the server's official results override the device's, the chain of holders goes on from the frozen holder, running and future rounds are never shown as decided, missing rounds are posted and the first writer's result is adopted)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-league-freeze
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/league_freeze_test.tscn
      - name: Daily / weekly quests and the free monthly pass (five daily and three weekly quests drawn per character and Thai day / week, kills / bosses / trades / stall sales / enhancing / party minutes / chat / world boss / guild war move them, claimed once for pass points, 30 tiers a month claimed one by one or all at once with a title at the top, day / week / month resets with a warning, saves stay valid, menu tab and red dot)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-daily-pass
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/daily_pass_test.tscn
      - name: The world is never empty (at least 16 stall keepers in the village and 22 online at every moment, scheduled players level and only drop in on short errands, world clock x3, veterans, newcomers, endgame, guild war everyone at Lv.100 up to 25 a side)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-world-town
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/world_town_test.tscn
      - name: New players every day (2-3 a Thai day made from the date alone, the same on every device, unique names, classes and guilds spread evenly, Lv.1 on their day then a hardcore pace, welcomed once in the world chat; every scheduled player hardcore taking turns to rest, never all online; the guild war fields each guild's best 25; timings)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-newcomers
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/newcomers_test.tscn
      - name: Trading at the players' stalls (a stall's stock is fixed per restock window, gear of the keeper's own level above the merchant's grade, cheaper potions, buying takes the lot off the stall, the stall pays more than the merchant, old flags pruned, open_stall / open_shop; haggling deterministic once a lot a window with the discount paid at the buy, keepers announce a real lot, consignment takes the item and pays 1.5x after 30 min, at most 8 out)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-stall-trade
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/stall_trade_test.tscn
      - name: Chat trade and chatter (the world players talk in threads, 1-3 answers seconds apart, busier than before but under the rate cap, guild and party banter; buy requests in Thai read and answered by the stalls that have it with price and place, or "nobody sells it"; a stall's stock follows its keeper's level and stars)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-chat-trade
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/chat_trade_test.tscn
      - name: Dark Lord Summon is never automatic (auto-hunt never casts it, the player's press does, an AI Dark Lord only to gather a straggler)
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/lord_summon_test.tscn
      - name: Defender's Blood Swell (max HP +30-50% and damage -10-25% for a minute, filled in and taken back, always on the bar, AI casters too)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-blood-swell
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/blood_swell_test.tscn
      - name: Daily party raid (party of 3+, two entries a day, three floors with a mid-boss, a boss with buster / circles / shielding adds / 50% phase / enrage, AI steps out and provokes, rewards once with the first-clear chest)
        timeout-minutes: 10
        env:
          XDG_DATA_HOME: /tmp/toon-ci-raid
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/raid_test.tscn
      - name: World players party up among themselves (parties of 2-5 at a similar level, the same on every device for the same moment, breaking up and forming anew, a modest EXP bonus for partying, hunting together round the leader, a healer heals a mate, a Dark Lord summons a straggler never the hero, the hero can still invite a member)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-ai-party
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/ai_party_test.tscn
      - name: Check effects refused by the spent VFX budget are freed (long-fight leak)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-vfx-leak
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/vfx_budget_leak_test.tscn
      - name: Class signatures of the Archer, Assassin and Dark Lord (every skill and star skill builds its class layers at high quality, fewer under memory pressure and at low quality, no node growth over 150 casts, pools released on zone change)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-shadow-art
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/shadow_art_test.tscn
      - name: Check zones build the same in slices as in one go, and the ground grid is intact
        env:
          XDG_DATA_HOME: /tmp/toon-ci-zone-staged
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/zone_staged_test.tscn
      - name: Check no village rock or tree lands on a villager or the spot in front of them (layouts that walled the elder in)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-village-yard
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/village_yard_test.tscn
      - name: Check the summon looks (new models, eye fire, real swords, Chibi Demon)
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/summon_looks_test.tscn
      - name: Check the hero looks (six styles, colours, accessories, old saves unchanged)
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/chibi_look_test.tscn
      - name: Check star gear is graded by tier and the class set is best
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/gear_tier_order_test.tscn
      - name: Check the owner boost tool (one named character to Lv.100 / 200 stars in +10 gear)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-boost
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/boost_character_test.tscn
      - name: Enhancing to +15 and the set aura (harder odds and more jewels from +11, nine aura steps +5 +7 +9 +10 .. +15 from the lowest + of weapon, armour, helm and boots, pieces glow on their own, jewels and feathers fly to the hero)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-enhance-aura
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/enhance_aura_test.tscn
      - name: Gem system (shares not flat numbers, five sizes fused three into one, drills up to 3 sockets and a fourth at +15, resonance, 12-gem sets, special gems, old gem ids valid)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-gem-system
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/gem_system_test.tscn
      - name: Validate gem abilities, special gem drops and legendary gem sparkle
        env:
          XDG_DATA_HOME: /tmp/toon-ci-gems
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/gem_effects_test.tscn
      - name: Star cap 300 and the God promotion (EXP curve unchanged to ★200 and steeper to ★300, 300 points all spendable, เทพเจ้าแห่ง<อาชีพ> at Lv.100 ★300 with bigger bonuses than Lv.80, character screen and title, saved and validated)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-star300
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/star300_test.tscn
      - name: Check the account server accepts the game's own saves of every class (committed fixture, then a fresh one)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-save-fixtures
        run: |
          node hosting/accounts/tests/account.test.mjs
          Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/tools/save_fixtures.tscn -- /tmp/toon-ci-save-fixtures/game_profiles.json
          TOON_SAVE_FIXTURES=/tmp/toon-ci-save-fixtures/game_profiles.json node hosting/accounts/tests/account.test.mjs
      - name: Mounts (bought in the สัตว์ขี่ tab, saved and repaired, faster while riding with the weapon stowed, off on any fight or in guild war / pvp / tower / arena, HUD ขี่ button only with a mount)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-mounts
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/mount_test.tscn
      - name: 250-star class sets (one set core makes any piece of any class at the forge for 20 purple + 20 pink + 20 chaos at 50%, every stat at +0 beats the best other piece at +10, worn from 250 stars, 2/4/6 piece bonus, class aura and models, icons, saves, the forge's ผสมชุดเซต section)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-set-gear
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/set_gear_test.tscn
      - name: 250-star set recipe (weapon/armour/helm/boots use up the class's divine piece at +10 up, ring/amulet 5 Lotus Scales, a failure keeps them, pick order and worn-piece confirmation, ผสมชุดเซต requirement lines, one drop table for the sanctuary and the abyss, scales nowhere else, saves)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-set-recipe
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/set_recipe_test.tscn
      - name: Loot magnet (every drop the hero earned flies to it from anywhere in the zone and is collected, world players' kills stay theirs, a full bag leaves gear on the ground with one toast until there is room, stacks still join, capped sparkles)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-loot-magnet
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/loot_magnet_test.tscn
      - name: HUD clutter (damage numbers fan out, others' numbers smaller and capped, party labels fade in a fight, the hero's gold ring, no repeated chat line)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-clutter
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/hud_clutter_test.tscn
      - name: Tutorial (a guide world player walks a new hero through the first quest, potion, field, kills and turn-in)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-tutorial
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/tutorial_test.tscn
      - name: Achievements and titles (rules from the profile, earned once, title on the hero's name plate, menu tab)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-achievements
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/achievements_test.tscn
      - name: Party talk (members warn when the hero bleeds or a boss appears, once per gap, bubble + party chat under their name, gather behind the hero at a villager, the typed orders ตามมา / รอตรงนี้ / กลับเมือง)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-party-talk
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/party_talk_test.tscn
      - name: Timed world events (EXP x2 19:00-21:00 Thai time, the world boss at 20:30 for 20 minutes in the field of the day, +20% gold on the weekend, add_exp doubles in the window, the world boss spawns once a window and pays a bounty)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-world-events
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/world_events_test.tscn
      - name: Halloween event (Halloween potion drops 5% until 1 Nov 2026 00:00 Thai, EXP x2 or x3 for an hour of real time, still counting while the game is closed)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-halloween
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/halloween_test.tscn
      - name: Weekend jewel rush (forge jewels x2 on Saturday and Sunday Thai time, feathers not) and the golden monster (every 15 minutes for 3 minutes in every levelling field, 5x HP, gold pile and jewels, never in town or the guild war)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-weekend-events
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/weekend_events_test.tscn
      - name: Check a party member levels by the party's shared EXP only
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/party_exp_test.tscn
      - name: Check talking to the world players in the game (request, answers, party actions)
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/ai_chat_test.tscn
      - name: Party and guild chat (channels apart from the world chat, HUD tabs ทั้งหมด / โลก / ปาร์ตี้ / กิลด์, members answer to the point and each other within the cap and cooldown, notes without a party or guild)
        env:
          XDG_DATA_HOME: /tmp/toon-ci-chat-channels
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/chat_channels_test.tscn
      - name: Check the AI chat with the world players (account gate, limits, request, replies; no real API calls)
        run: |
          cd hosting/worker
          npm install --omit=dev --no-audit --no-fund
          node tests/chat.test.mjs
      - name: Online play server (room logic, party hosts, trades, duels, stalls, limits, WorldRoom hibernation, /api/online routes, guild league official results /api/league; then the real Worker under wrangler dev with a local D1 and two WebSockets)
        run: |
          cd hosting/worker
          node tests/online.test.mjs
          node tests/league.test.mjs
          npm install --no-audit --no-fund
          node tests/online_e2e.mjs
      - name: Check the UI canvas buffers stay within the video memory budget
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/render_budget_test.tscn
      - name: Check the elder's quest chain past Lv.99
        env:
          XDG_DATA_HOME: /tmp/toon-ci-quests
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/quest_chain_test.tscn
      - name: Check damage balance on every field
        env:
          XDG_DATA_HOME: /tmp/toon-ci-balance
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/tools/balance_probe.tscn -- check
      - name: Play the integration flow
        env:
          XDG_DATA_HOME: /tmp/toon-ci-flow
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/integration/flow_test.tscn
      - name: Test streaming web loader
        run: |
          node tools/test_web_loader.mjs
          node tools/test_web_session.mjs
      - name: Test the offline web app (service worker caches the build, offline boot without login wall, offline save syncs, update swap)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          # Playwright cannot install its own Chromium's system deps on this runner OS;
          # the runner image already ships Chrome, so drive that one.
          CHROMIUM_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROMIUM_PATH" ]; then npx playwright install chromium; fi
          export CHROMIUM_PATH
          echo "browser: ${CHROMIUM_PATH:-playwright chromium}"
          node tools/test_web_offline.mjs
          node tools/test_accounts_client.mjs
          node hosting/accounts/tests/static.test.mjs
