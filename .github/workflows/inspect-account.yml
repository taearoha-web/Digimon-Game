name: Inspect a game account (owner only, read-only)

# Manual only, and only for people with write access to this repository.
# Prints every character of one game account: level, stars, the guild-war power (the number
# the world players are ranked by), stats, each worn piece's +, gems and wings, and where it
# would stand among the world players right now. Nothing is written anywhere.
on:
  workflow_dispatch:
    inputs:
      username:
        description: Game ID (account)
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: ${{ vars.D1_DATABASE_NAME || 'toon-tale-accounts' }}
      TARGET_USER: ${{ inputs.username }}
      XDG_DATA_HOME: /tmp/toon-inspect-data
    steps:
      - name: Check the request
        run: |
          echo "$TARGET_USER" | grep -Eq '^[a-z0-9_]{3,24}$' || { echo "::error::Invalid game ID."; exit 1; }
          echo "$DB_NAME" | grep -Eq '^[A-Za-z0-9_-]{1,64}$' || { echo "::error::Invalid database name."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" -a -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare secrets are missing."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Godot 4.3
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import assets
        run: Godot_v4.3-stable_linux.x86_64 --headless --editor --import --path . > /tmp/import.log 2>&1 || { tail -50 /tmp/import.log; exit 1; }
      - name: Fetch the online save (read-only)
        run: |
          mkdir -p /tmp/inspect
          node hosting/worker/boost-character.mjs fetch "$TARGET_USER" /tmp/inspect
      - name: Every character's power
        run: |
          Godot_v4.3-stable_linux.x86_64 --headless --path . res://tools/inspect_account.tscn -- --in /tmp/inspect/bundle.json 2>&1 | tee /tmp/inspect/log.txt
          grep '^INSPECT|' /tmp/inspect/log.txt | sed 's/^INSPECT|//' | tr '|' '\t' >> "$GITHUB_STEP_SUMMARY" || true
          grep -q '^INSPECT|' /tmp/inspect/log.txt
