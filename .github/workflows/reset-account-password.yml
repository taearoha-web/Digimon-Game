name: Reset one game account password (owner only)

# Manual only, and only for people with write access to this repository.
# The new password (and an optional new recovery code) are read from repository secrets, so they never
# appear in this file, in the run inputs or in the logs (Actions masks secret values):
#   RESET_PASSWORD        new password, 10-128 characters
#   RESET_RECOVERY_CODE   optional new recovery code, at least 12 letters/digits you choose
# Delete both secrets after the run. The account's saved characters are not touched;
# every logged-in session of that account is signed out.
on:
  workflow_dispatch:
    inputs:
      username:
        description: Game ID to reset (3-24 letters, digits, underscore)
        default: taearoha
        required: true
      confirm:
        description: Type RESET to confirm
        required: true
      database_name:
        description: D1 database name
        default: toon-tale-accounts
        required: true

permissions:
  contents: read

concurrency:
  group: reset-account-password
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: ${{ inputs.database_name }}
      TARGET_USER: ${{ inputs.username }}
      NEW_PASSWORD: ${{ secrets.RESET_PASSWORD }}
      NEW_RECOVERY: ${{ secrets.RESET_RECOVERY_CODE }}
    steps:
      - name: Check the request
        run: |
          test "${{ inputs.confirm }}" = "RESET" || { echo "::error::Type RESET in the confirm field."; exit 1; }
          echo "$TARGET_USER" | grep -Eq '^[a-z0-9_]{3,24}$' || { echo "::error::Invalid game ID."; exit 1; }
          echo "$DB_NAME" | grep -Eq '^[A-Za-z0-9_-]{1,64}$' || { echo "::error::Invalid database name."; exit 1; }
          test -n "$NEW_PASSWORD" || { echo "::error::Add the repository secret RESET_PASSWORD first."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" -a -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare secrets are missing."; exit 1; }
          echo "::add-mask::$NEW_PASSWORD"
          test -z "$NEW_RECOVERY" || echo "::add-mask::$NEW_RECOVERY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        working-directory: hosting/worker
        run: npm install --no-audit --no-fund
      - name: Reset the password
        working-directory: hosting/worker
        run: |
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID=$(node -e "const l=JSON.parse(require('fs').readFileSync('/tmp/d1.json','utf8'));const d=l.find(x=>x.name===process.env.DB_NAME);console.log(d?(d.uuid||d.id||''):'')")
          test -n "$DB_ID" || { echo "::error::Database $DB_NAME not found."; exit 1; }
          node -e "
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('wrangler.example.jsonc','utf8'));
            c.d1_databases[0].database_name=process.env.DB_NAME;
            c.d1_databases[0].database_id='$DB_ID';
            fs.writeFileSync('wrangler.jsonc',JSON.stringify(c,null,2));
          "
          npx wrangler d1 execute "$DB_NAME" --remote --json \
            --command "SELECT id FROM toon_users WHERE username = '$TARGET_USER'" > /tmp/user.json
          USER_ID=$(node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/user.json','utf8'));const rows=(r[0]||r).results||[];console.log(rows[0]?rows[0].id:'')")
          test -n "$USER_ID" || { echo "::error::No account named $TARGET_USER exists in this database."; exit 1; }
          echo "$USER_ID" | grep -Eq '^[A-Za-z0-9_-]{8,64}$' || { echo "::error::Unexpected user id format."; exit 1; }
          node reset-password.mjs "$USER_ID" /tmp/reset.sql
      - name: Apply
        working-directory: hosting/worker
        run: |
          test -s /tmp/reset.sql || { echo "::error::Nothing to apply."; exit 1; }
          npx wrangler d1 execute "$DB_NAME" --remote --file /tmp/reset.sql
          rm -f /tmp/reset.sql
          echo "Password reset for $TARGET_USER. Saved characters were not touched; all sessions were signed out."
